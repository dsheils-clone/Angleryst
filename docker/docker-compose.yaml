version: '3.8'
services:
 db:
    image: postgres
    restart: always

    environment:
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_USER: ds
      POSTGRES_DB: anglerystDB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres-data: