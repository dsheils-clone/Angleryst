apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: angleryst/recommendation-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8094
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: angleryst-secret
                  key: jwt-secret
          readinessProbe:
            tcpSocket:
              port: 8094
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
spec:
  selector:
    app: recommendation-service
  ports:
    - port: 8094
      targetPort: 8094
