apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: angleryst/inventory-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: angleryst-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: angleryst-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: angleryst-secret
                  key: jwt-secret
          readinessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8093
      targetPort: 8093
