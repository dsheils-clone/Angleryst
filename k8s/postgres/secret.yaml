apiVersion: v1
kind: Secret
metadata:
  name: angleryst-secret
type: Opaque
# NOTE: base64 in a committed manifest is encoding, NOT encryption — never put real
# credentials here. This is a template: replace the placeholders below at deploy time
# (e.g. `kubectl create secret generic angleryst-secret --from-literal=...`) or manage
# them with a Sealed Secrets / External Secrets operator.
stringData:
  db-password: REPLACE_WITH_DB_PASSWORD
  jwt-secret: REPLACE_WITH_BASE64_JWT_SECRET
